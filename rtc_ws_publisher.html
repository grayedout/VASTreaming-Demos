<html>
<head>
    <title>WebRTC publisher test page</title>
</head>
<body>

    <div>
        <video id="local-video" width="320" height="240" autoplay playsinline muted></video><br>
    </div>

    <hr>
    <label for="video-source">Camera: </label><select id="video-source"></select>
    <br>
    <label for="audio-source">Microphone: </label><select id="audio-source"></select>
    <br><br>
    Server: <input type="text" id="server" value="ws://192.168.0.102:8888/rtc" /><br>
    Publishing path: <input type="text" id="pub-path" value="test" />
    <br><br>
    <button id="connect" onclick="connect();">Start</button>
    <button disabled="true" id="disconnect" onclick="disconnect();">Stop</button>
    <br>
    <button onclick="document.getElementById('debug').innerHTML='';">Clear log</button>
    <hr>
    <br>
    <pre id="debug"></pre>

    <script>

        const pcConfig = { "iceServers": [{ "urls": ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19305"] }] };
        //const pcConfig = { "iceServers": [{ "urls": ["turn:127.0.0.1:3478"], "username": "user", "credential": "password" }] };

        var websocket = null;
        var myId = -1;
        var localStream;
        var pc;
        var signallingUri;
        var pingInterval = null;
        var disconnecting = false;

        enumerateDevices();

        async function enumerateDevices() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                let devices = await navigator.mediaDevices.enumerateDevices();
                gotDevices(devices);
                if (localStream != null) {
                    localStream.getTracks().forEach(function (track) {
                        track.stop();
                    });
                    localStream = null;
                }
            } catch (e) {
                trace("enumerate error: " + e);
            }
        }

        function gotDevices(deviceInfos) {
            var audioInputSelect = document.getElementById("audio-source");
            var videoInputSelect = document.getElementById("video-source");
            trace("found " + deviceInfos.length + " devices");
            for (let i = 0; i !== deviceInfos.length; ++i) {
                const deviceInfo = deviceInfos[i];
                const option = document.createElement('option');
                option.value = deviceInfo.deviceId;
                if (deviceInfo.kind === 'audioinput') {
                    option.text = deviceInfo.label || `Microphone ${audioInputSelect.length + 1}`;
                    audioInputSelect.appendChild(option);
                } else if (deviceInfo.kind === 'videoinput') {
                    option.text = deviceInfo.label || `Camera ${videoInputSelect.length + 1}`;
                    videoInputSelect.appendChild(option);
                }
            }
        }

        function connect() {
            document.getElementById("connect").disabled = true;
            document.getElementById("disconnect").disabled = false;
            signIn();
        }

        function disconnect() {
            try {
                if (disconnecting) return;

                disconnecting = true;

                if (websocket) {
                    sendToPeer("sign-out", 1, null);
                    // close web socket after timeout to make sure server receives our sign-out message
                    try {
                        window.setTimeout(() => {
                            try {
                                websocket.close();
                            } catch (e) {
                            }
                            websocket = null;
                            trace("Web socket closed");
                        }, 3000);
                    } catch (e) {
                        trace("Hanging get send error: " + e);
                    }
                }

                if (pingInterval != null) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }

                myId = -1;

                if (localStream != null) {
                    localStream.getTracks().forEach(function (track) {
                        track.stop();
                    });
                    localStream = null;
                }

				try {
					if (pc != null) {
						pc.close();
					}
				} catch (e) {
					trace("Remote PC close error: " + e);
				}

                document.getElementById("connect").disabled = false;
                document.getElementById("disconnect").disabled = true;

                try {
                    var videoElement = document.getElementById('local-video');
                    videoElement.stop();
                } catch (e) {
                }

                trace("Disconnected");
            } catch (e) {
                trace("Disconnect error: " + e);
            }
        }

        async function signIn() {
            try {
                disconnecting = false;

                var audioInputSelect = document.getElementById("audio-source");
                const audioSource = audioInputSelect.value;
                var videoInputSelect = document.getElementById("video-source");
                const videoSource = videoInputSelect.value;
                const constraints = {
                    audio: { deviceId: audioSource ? { exact: audioSource } : undefined },
                    video: { deviceId: videoSource ? { exact: videoSource } : undefined, width: { exact: 320 }, height: { exact: 240 } }
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);

                var videoElement = document.getElementById('local-video');
                videoElement.srcObject = localStream;
                videoElement.play();

                var publishingPath = document.getElementById("pub-path").value.toLowerCase();
                signallingUri = document.getElementById("server").value.toLowerCase();

                var uri = signallingUri + "/sign-in?publishing-path=" + publishingPath + "&publish=true";
                websocket = new WebSocket(uri);
                websocket.onopen = function (e) {
                    trace("Signalling server connected");
                };
                websocket.onclose = function (e) {
                    trace("Signalling server disconnected. Code: " + e.code + ", reason: " + e.reason);
                    disconnect();
                };
                websocket.onmessage = function (e) {
                    processResponse(e.data);
                };
                websocket.onerror = function (e) {
                    trace("Web socket error: " + e.data);
                };
            } catch (e) {
                trace("Sing in error: " + e);
            }
        }

        function processResponse(data) {
            if (data == null || data.length == 0) return;

            var dataJson = JSON.parse(data);
            if (dataJson == null) {
                trace(str);
                trace("Unsupported message!");
                return;
            }

            var peerId = parseInt(dataJson.from);
            var str = "Message from " + peerId + " 'server': " + data;

            if (dataJson["data-type"] == "peer-list") {
                myId = parseInt(dataJson.data[0].id);
                trace("My id: " + myId);
                for (var i = 1; i < dataJson.data.length; i++) {
                    trace("Peer " + i + ": id " + dataJson.data[i].id + ", name: " + dataJson.data[i].name + ", state: " + dataJson.data[i].state);
                }
                // create peer connection to server
				createLocalPeerConnection(1);
                pingInterval = setInterval(() => {
                    sendToPeer("ping", 1, null);
                }, 10000);
            }
            else if (dataJson["data-type"] == "message") {
                trace(str);
                dataJson = dataJson.data;
                if (dataJson != null && dataJson.type != null && dataJson.type == "answer") {
                    trace("Received SDP answer");
                    pc.setRemoteDescription(new RTCSessionDescription(dataJson), onRemoteSdpSucces, onRemoteSdpError);
                }
                else if (dataJson != null && dataJson.candidate != null) {
                    var candidate = new RTCIceCandidate({ sdpMLineIndex: dataJson.sdpMLineIndex, candidate: dataJson.candidate });
                    pc.addIceCandidate(candidate, onAddIceCandidateSuccess, onAddIceCandidateError);
                }
                else {
                    trace("Unsupported message!");
                }
            }
            else if (dataJson["data-type"] == "action") {
                //trace(str);
                dataJson = dataJson.data;
                if (dataJson.action == "disconnect") {
                    trace(str);
                    disconnect();
                } else {
                    trace("Unsupported action: " + dataJson.action);
                }
            }
            else {
                trace(str);
                trace("Unsupported message!");
            }
        }

        function sendToPeer(dataType, peerId, data) {
            try {
                var dataJson = '{"data-type":"' + dataType + '","from":' + myId + ',"to":' + peerId;
                if (data != null) {
                    dataJson += ',"data":' + data;
                }
                dataJson += '}';
                trace("Sending: " + dataJson);
                websocket.send(dataJson);
            } catch (e) {
                trace("send to peer error: " + e);
            }
        }

        function createLocalPeerConnection(peerId) {
            try {
                pc = new RTCPeerConnection(pcConfig);
                pc.onicecandidate = function (event) {
                    if (event.candidate) {
                        var candidate = {
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                            sdpMid: event.candidate.sdpMid,
                            candidate: event.candidate.candidate
                        };
                        sendToPeer("message", peerId, JSON.stringify(candidate));
                    } else {
                        trace("Peer " + peerId + " local PC end of candidates.");
                    }
                };
                pc.onconnecting = function (message) {
                    trace("Peer " + peerId + " local PC session connecting.");
                };
                pc.onopen = function (message) {
                    trace("Peer " + peerId + " local PC session opened.");
                };
                pc.onremovestream = function (event) {
                    trace("Peer " + peerId + " local PC remote stream removed.");
                };
                pc.onidpvalidationerror = function (ev) {
                    trace("Peer " + peerId + " local PC onidpvalidationerror");
                };
                pc.onidpassertionerror = function (ev) {
                    trace("Peer " + peerId + " local PC onidpassertionerror");
                };
                pc.onnegotiationneeded = async function () {
                    try {
                        trace("Peer " + peerId + " local PC onnegotiationneeded");
                        await pc.setLocalDescription(await pc.createOffer());
                        var data = JSON.stringify(pc.localDescription);
                        trace("Prepared SDP offer: " + data);
                        sendToPeer("message", peerId, data);
                    } catch (e) {
                        trace("Failed to negotiate, exception: " + e);
                    }
                };
                pc.onconnectionstatechange = function (event) {
                    trace("Peer " + peerId + " local PC connection state changed to " + pc.connectionState);
                };
                pc.oniceconnectionstatechange = function (event) {
                    trace("Peer " + peerId + " local PC ICE connection state changed to " + pc.iceConnectionState);
                };
                pc.onicegatheringstatechange = function () {
                    trace("Peer " + peerId + " local PC ICE gathering state changed to " + pc.iceGatheringState);
                };
                pc.onsignalingstatechange = function (event) {
                    trace("Peer " + peerId + " local PC signaling state changed to " + pc.signalingState);
                };
                localStream.getTracks().forEach((track) => {
                    try {
                        trace("Local stream added: " + track.kind + ", active: " + localStream.active);
                        pc.addTrack(track, localStream);
                    } catch (e) {
                        trace("Local stream added exception: " + e);
                    }
                });
                trace("Peer " + peerId + " local PC created");
            }
            catch (e) {
                trace("Peer " + peerId + " Failed to create local PC, exception: " + e);
            }
        }

        function onSetLocalSdpSuccess() {
            trace("setLocalDescription success");
        }

        function onSetLocalSdpError() {
            trace("setLocalDescription failed");
        }

        function onAddIceCandidateSuccess() {
            trace("addIceCandidate success");
        }

        function onAddIceCandidateError() {
            trace("addIceCandidate failed");
        }

        function onRemoteSdpSucces() {
            trace('onRemoteSdpSucces');
        }

        function onRemoteSdpError(event) {
            trace("onRemoteSdpError: event.name: " + event.name + ", event.message: " + event.message);
        }

        function parseIntHeader(r, name) {
            var val = r.getResponseHeader(name);
            return val != null && val.length ? parseInt(val) : -1;
        }

        function showRecordingError(text) {
            var elem = document.getElementById("recording-error");
            elem.innerHTML = text + " Recorded judge voice will mismatch the performance. Please restart the recording!";
        }

        function trace(txt) {
            var elem = document.getElementById("debug");
            elem.innerHTML += txt + "<br>";
            console.log(txt);
        }

        window.onbeforeunload = disconnect;
    </script>

</body>
</html>
